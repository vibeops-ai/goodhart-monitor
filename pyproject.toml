[project]
name = "goodhart-monitor"
version = "0.1.0"
description = "Independent verification records for deployed clinical prediction models"
requires-python = ">=3.11"
# jsonschema is not optional: without it every emitted object goes unvalidated
# and the pipeline says so instead of failing, which is a quiet way to ship
# invalid contracts.
dependencies = ["pandas>=2.0", "scikit-learn>=1.3", "numpy>=1.24", "pyarrow>=14",
                "jsonschema>=4.20"]

[project.scripts]
goodhart-monitor = "goodhart_monitor.cli:main"

[project.optional-dependencies]
dev = ["pytest>=8"]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/goodhart_monitor"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
